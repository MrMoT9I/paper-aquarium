# Аквариум за Traefik: сервер отдаёт страницы по HTTP внутри докер-сети,
# наружу торчит только прокси — он же держит HTTPS и сертификат. Своего
# прокси у аквариума нет намеренно: 80 и 443 на сервере уже заняты Traefik,
# и второй туда не встанет.
#
# Что нужно рядом с этим файлом:
#   .env    — DOMAIN=aquarium.mrmot9i.com
#   pack/   — собранный пак моделей (в репозиторий он не входит)
#   data/   — аквариумы; создаётся сам, но владельца проставить надо (uid 1000)
#
# Сеть web общая и живёт отдельно от этого файла — её держит Traefik.
# Проверить, что она на месте: docker network ls | grep web

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  aqua:
    logging: *default-logging
    build: .
    image: aqua:latest
    container_name: aqua
    restart: unless-stopped
    # PID 1 внутри контейнера — настоящий init, а не node. Node подбирать
    # чужих осиротевших потомков не умеет, и всё, что к нему переезжает,
    # остаётся зомби до перезапуска. Своих потомков у сервера нет, но
    # healthcheck выполняется внутри контейнера и при таймауте оставляет
    # именно такую сироту.
    init: true
    environment:
      # Пределы на случай, когда ссылку узнал кто-то лишний. Подробности —
      # в LIMITS в server.js.
      AQUA_MAX_TANKS: ${AQUA_MAX_TANKS:-200}
      AQUA_TANKS_PER_HOUR: ${AQUA_TANKS_PER_HOUR:-5}
      AQUA_MAX_FISH: ${AQUA_MAX_FISH:-40}
      AQUA_MAX_BG: ${AQUA_MAX_BG:-8}
      AQUA_MAX_DATA_MB: ${AQUA_MAX_DATA_MB:-2048}
      # Аквариум-витрина: главная показывает новичкам кнопку «Посмотреть
      # живой аквариум». Пусто — кнопки нет.
      AQUA_DEMO_TANK: ${AQUA_DEMO_TANK:-}
    volumes:
      # Аквариумы переживают пересборку образа. Обычная папка, а не том:
      # внутри детские рисунки, и бэкап их архивом проще, чем через docker.
      - ./data:/app/data
      # Купленный пак: лежит на сервере, в git его нет. Только чтение.
      - ./pack:/app/assets/models/pack:ro
    expose:
      - "8000"
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      # Второй хост us.<домен> — тестовая прокладка через US-VPS для РФ:
      # DNS поддомена смотрит на 157.173.200.234, тот форвардит 80/443 сюда.
      - "traefik.http.routers.aqua.rule=Host(`${DOMAIN}`) || Host(`us.${DOMAIN}`)"
      - "traefik.http.routers.aqua.entrypoints=websecure"
      - "traefik.http.routers.aqua.tls.certresolver=letsencrypt"
      - "traefik.http.services.aqua.loadbalancer.server.port=8000"
      # Сцена тянет three.js и модели рыб — сжатие заметно ускоряет первую
      # загрузку. Картинки Traefik не жмёт: они и так сжаты.
      - "traefik.http.middlewares.aqua-compress.compress=true"
      - "traefik.http.routers.aqua.middlewares=aqua-compress"

networks:
  web:
    external: true
